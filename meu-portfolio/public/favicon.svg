<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Glowing Terminal & Monogram Symbol -->
  <g filter="url(#glow)">
    <!-- Terminal prompt symbol > -->
    <path d="M16 22 L26 32 L16 42" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Modern cursor / underline _ -->
    <line x1="31" y1="42" x2="48" y2="42" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Accent Dot (Active Engineer Indicator) -->
  <circle cx="48" cy="22" r="3.5" fill="#34D399"/>
</svg>
